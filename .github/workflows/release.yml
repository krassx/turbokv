# Prebuilds and publish.
#
# The addon is Node-API, so its ABI is stable across Node majors: ONE prebuild
# per (platform, arch, libc) serves every supported Node, and there is no
# per-version matrix to maintain. prebuildify puts them in prebuilds/ and they
# ship INSIDE the npm tarball, so installing needs no network and no compiler.
#
# That also fixes the Bun install: node-gyp-build's install script is a no-op
# when a matching prebuild is present, and if Bun blocks it entirely (Bun blocks
# lifecycle scripts unless the package is in trustedDependencies) require-time
# resolution still finds the prebuild. Platforms WITHOUT a prebuild below fall
# back to compiling from source, exactly as before.
name: prebuild and publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (otherwise build prebuilds only)'
        type: boolean
        default: false
      bootstrap:
        description: 'FIRST publish only: authenticate with NPM_TOKEN instead of OIDC. Trusted publishing is configured on an EXISTING package, so the very first version cannot use it.'
        type: boolean
        default: false

jobs:
  prebuild:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        include:
          - { name: linux-x64-glibc,   os: ubuntu-22.04 }
          - { name: linux-arm64-glibc, os: ubuntu-22.04-arm }
          - { name: darwin-x64,        os: macos-15-intel }
          - { name: darwin-arm64,      os: macos-14 }
          - { name: win32-x64,         os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Any supported Node produces the same prebuild -- Node-API, one binary
        # per platform. Pinned so the build is reproducible, not because the
        # version matters.
        with: { node-version: '22' }

      # ubuntu-22.04 rather than -latest deliberately: a prebuild links the
      # glibc it was built against, so the OLDEST supported runner gives the
      # widest compatibility. Building on 24.04 would refuse to load on 22.04.
      # node-gyp-build is a RUNTIME dependency: it resolves the addon, so the
      # verification and smoke-test steps below cannot require src/native
      # without it. --ignore-scripts because prebuildify does the build.
      - name: Runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Build prebuild
        run: npx --yes prebuildify@^6 --napi --strip

      - name: It must load, and it must be the prebuild that loaded
        shell: bash
        run: |
          rm -rf build                        # so only prebuilds/ can satisfy it
          node -e "
            const path = require('node-gyp-build').path('.');
            if (!path.includes('prebuilds')) { console.error('resolved ' + path + ', not a prebuild'); process.exit(1); }
            const n = require('node-gyp-build')('.');
            if (typeof n.create !== 'function') { console.error('addon loaded but has no create()'); process.exit(1); }
            console.log('loaded ' + path);
          "

      - name: Smoke test the suite against the prebuild
        run: node test/run.js

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.name }}
          path: prebuilds/
          if-no-files-found: error
          retention-days: 7

  # Linux musl (Alpine) is a separate job because it needs a container rather
  # than a runner image. node-gyp-build picks .musl/.glibc by reading the
  # running process's libc, so both can sit in the same prebuilds/ tree.
  prebuild-musl:
    name: linux-x64-musl
    runs-on: ubuntu-22.04
    container:
      image: node:22-alpine
      # Docker defaults /dev/shm to 64MB and the arena IS shared memory, so the
      # suite needs more; the glibc runners never hit this because they are VMs
      # whose /dev/shm is half of RAM. This was 8g while the suite leaked a
      # segment per process. With that fixed the requirement is just the largest
      # single arena the suite builds -- perf_regression_test asks for 128MB so
      # that nothing evicts while it measures. Measured in this exact image:
      # 128m fails, 256m passes. 512m is 2x the known-good floor.
      options: --shm-size=512m
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: apk add --no-cache python3 make g++
      # node-gyp-build is a RUNTIME dependency: it resolves the addon, so the
      # verification and smoke-test steps below cannot require src/native
      # without it. --ignore-scripts because prebuildify does the build.
      - name: Runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Build prebuild
        run: npx --yes prebuildify@^6 --napi --strip --tag-libc
      - name: It must load, and it must be the prebuild that loaded
        run: |
          rm -rf build
          node -e "
            const path = require('node-gyp-build').path('.');
            if (!path.includes('prebuilds')) { console.error('resolved ' + path); process.exit(1); }
            require('node-gyp-build')('.');
            console.log('loaded ' + path);
          "
      - name: Smoke test the suite against the prebuild
        run: node test/run.js
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-x64-musl
          path: prebuilds/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual run builds and checks the prebuilds
    # without publishing unless it is asked to.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: read
      id-token: write           # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. Node 24
          # clears the first; the npm that ships with it does not necessarily
          # clear the second, so it is upgraded explicitly below rather than
          # left to whatever the runner image happens to carry.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # npm's docs suggest package-manager-cache: false, which is a
          # setup-node v5 input. On v4 caching is off unless `cache:` is set,
          # and it is not, so there is nothing to disable.

      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prebuild-*
          merge-multiple: true      # every job wrote prebuilds/<tuple>/, so they merge

      - name: Collect the prebuilds
        shell: bash
        run: |
          mkdir -p prebuilds
          cp -r artifacts/* prebuilds/ 2>/dev/null || true
          find prebuilds -type f | sort
          count=$(find prebuilds -name '*.node' | wc -l | tr -d ' ')
          echo "prebuilds: $count"
          # 5 runner targets + musl. Publishing with a platform silently missing
          # is worse than not publishing: that platform gets a source build with
          # no warning, and on Bun no build at all.
          [ "$count" -eq 6 ] || { echo "expected 6 prebuilds, got $count"; exit 1; }

      - name: The tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package.json $pkg"; exit 1; }

      - name: What would ship
        run: npm pack --dry-run

      # A release workflow that hard-fails on a re-run is a trap you find out
      # about during an incident: re-running a red release, or tagging a version
      # that was published by hand, stops at the registry's "you cannot publish
      # over an existing version" rather than at something that reads as
      # deliberate. Asking first turns that into a skip with a notice, and
      # leaves every other step -- prebuilds, the load check, the smoke test --
      # doing its job.
      #
      # If this check itself cannot reach the registry it answers "not
      # published" and the publish proceeds, failing exactly as it does today.
      # The check is here to make a KNOWN republish legible, not to be the thing
      # that decides whether publishing is safe.
      - name: Is this version already published?
        id: published
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$ver is already on the registry -- skipping the publish step"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is not published yet"
          fi

      # Trusted publishing (OIDC). No token exists to leak, steal or forget to
      # rotate: npm verifies this workflow's identity against the trusted
      # publisher configured on the package, and provenance is attached without
      # asking. NODE_AUTH_TOKEN must NOT be set here -- if it is, npm uses it and
      # the OIDC path is silently skipped.
      - name: Publish (trusted publishing)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.bootstrap && steps.published.outputs.already == 'false' }}
        run: npm publish --access public

      # One-time path for the FIRST version. A trusted publisher is configured in
      # an existing package's settings on npmjs.com, so it cannot be set up
      # before the package exists. Publish 0.1.0 with `bootstrap: true`, add the
      # trusted publisher, then delete the NPM_TOKEN secret -- after which this
      # step can never authenticate again, which is the point.
      - name: Publish (bootstrap, token)
        if: ${{ inputs.bootstrap && steps.published.outputs.already == 'false' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
